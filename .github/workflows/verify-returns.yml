name: Verify returns vs Yahoo

# A separate, scheduled check rather than a step inside the newsletter.
#
# Inline was the obvious first idea and it is the wrong one: the oracle needs its own
# full pipeline run, and the render step is already throttle-bound — measured,
# render = 130s + 0.293s per failed Yahoo fetch, and one send has already been lost to
# a dropped download. Doubling the fetches per issue to gain a check would make the
# thing it guards fail more often.
#
# Daily and out of band catches a regression within a day, blocks nothing, and its
# failure is loud on its own. The newsletter keeps its own defence: the semantic gate,
# which refuses to ship a chart figure it cannot reproduce.

on:
  schedule:
    # Three weekday slots, and the times are chosen around two measured facts.
    #
    # GitHub delays this schedule badly. The single 06:17 UTC slot was firing at about
    # 11:24 -- five hours late -- which landed it in the middle of the European session
    # every day. Odd minutes (never :00 or :30, the two most contended) help but do not
    # fix it, so the schedule is built to tolerate the delay rather than assume it away.
    #
    # And check 2 can only DECIDE when the venues are shut. With a session open our
    # endpoint is a live quote while the source's is today's provisional close: the dates
    # match, so the referee rule is satisfied, but the prices do not, and the gap lands
    # on every window at once. That is what failed the 8 Sep run on one listing with a
    # uniform 0.07-0.11pp across 1m/3m/ytd/1y while the runs either side passed on the
    # same code. Check 1 -- the render against the engine, 119 figures -- is unaffected
    # and runs whatever the hour.
    #
    # European cash sessions are 07:00-15:30 UTC. So: one slot before the open, which a
    # delay pushes into the session and which then verifies check 1 only; and two after
    # the close, far enough back that even a five-hour slip lands with everything shut.
    - cron: "47 5 * * 1-5"
    - cron: "47 16 * * 1-5"
    - cron: "17 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install immutable dependencies
        run: python -m pip install --require-hashes --retries 5 --timeout 30 -r requirements.txt

      - name: Restore market-data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tarzan
          key: tarzan-verify-cache-${{ github.run_id }}
          restore-keys: |
            tarzan-market-cache-
            tarzan-verify-cache-

      # Every holding, every window. The script exits non-zero on any disagreement it
      # can actually decide, so this step IS the assertion.
      #
      # The book is not in this repo — only the taxonomy is tracked — so the Drive
      # credentials are what makes this check the REAL portfolio. Without them the
      # step fails on a missing order list rather than passing on an empty one.
      # Scoped to this step alone, as in the send: nothing before it sees a secret.
      # No SMTP, no claim store, no Drive WRITE: this renders and compares, and its
      # output is an artifact.
      - name: Compare the newsletter's figures against Yahoo
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
        run: python3 scripts/verify_returns_vs_yahoo.py --all

      # NO artifact upload, deliberately. This repo is public, and on a public repo a
      # run's artifacts are downloadable by anyone: output/verify_returns.html is the
      # fully rendered newsletter, positions and values included. The detail stays on
      # the machine that ran it. What CI publishes is the verdict -- ``$CI`` puts the
      # script in redacted mode, so the log carries counts and any finding, never a
      # per-instrument inventory of the book.
