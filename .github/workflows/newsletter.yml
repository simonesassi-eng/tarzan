# Tarzan portfolio newsletter automation.
# Scheduling remains external: Apps Script dispatches named market slots and
# this workflow serializes them without cancelling an active run.
#
# The validate job gates publication on behaviour only — the code imports,
# compiles, and passes its tests. Declaration audits (manifest, pins, scope,
# documentation) live in checks.yml, which runs on every push: an out-of-date
# declaration must never be the reason a digest is not delivered.
name: Tarzan Newsletter

on:
  workflow_dispatch:
    inputs:
      trigger_label:
        description: "Label for this run (shown in the email subject)"
        default: "manual"
        required: false
  repository_dispatch:
    types: [send_now]

concurrency:
  group: tarzan-newsletter
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install immutable dependencies
        # --retries/--timeout, because a lost download costs a whole issue. Measured
        # on run 33767975536: validate pulled all 48 wheels in 13s while send died on
        # the 4th after 41s of silence, same commit and same pinned hashes, and
        # `set -euo pipefail` turned that into no email at all. Retrying changes
        # nothing about WHAT is installed -- --require-hashes still pins every wheel.
        run: python -m pip install --require-hashes --retries 5 --timeout 30 -r requirements.txt

      - name: Compile positive Tarzan scopes
        run: python -m compileall -q tarzan scripts

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run Tarzan tests
        run: python -m pytest tarzan/tests -q

  send:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve trigger label
        id: trigger
        env:
          GH_EVENT: ${{ github.event_name }}
          MANUAL_LABEL: ${{ github.event.inputs.trigger_label }}
          REPO_DISPATCH_LABEL: ${{ github.event.client_payload.label }}
          REPO_DISPATCH_EVENT_ID: ${{ github.event.client_payload.event_id }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$GH_EVENT" == "repository_dispatch" ]]; then
            LABEL="${REPO_DISPATCH_LABEL:-on-demand}"
            EVENT_ID="${REPO_DISPATCH_EVENT_ID:-workflow:$GH_RUN_ID}"
          else
            LABEL="${MANUAL_LABEL:-manual}"
            EVENT_ID="workflow:$GH_RUN_ID"
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "event_id=$EVENT_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install immutable dependencies
        # --retries/--timeout, because a lost download costs a whole issue. Measured
        # on run 33767975536: validate pulled all 48 wheels in 13s while send died on
        # the 4th after 41s of silence, same commit and same pinned hashes, and
        # `set -euo pipefail` turned that into no email at all. Retrying changes
        # nothing about WHAT is installed -- --require-hashes still pins every wheel.
        run: python -m pip install --require-hashes --retries 5 --timeout 30 -r requirements.txt

      - name: Compute cache date
        id: cachedate
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # A speed optimisation, never a precondition: the run refetches whatever
      # the cache does not hand back, so a cache service outage or a future
      # incompatible action release must not cost a digest.
      - name: Restore market-data cache
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tarzan
          key: tarzan-market-cache-${{ steps.cachedate.outputs.date }}
          restore-keys: |
            tarzan-market-cache-

      # The verdict of the last independent return check, carried into the issue so a
      # disagreement reaches the reader instead of dying in a workflow log nobody
      # opens. `continue-on-error` and the `|| true` are both deliberate: this is a
      # nice-to-have annotation, and a GitHub API hiccup must never cost a digest.
      # Empty outputs render nothing at all.
      # Unauthenticated on purpose. The obvious version handed gh the automatic per-run
      # GitHub token, which tripped the gate in test_delivery_gates.py that keeps every
      # credential inside the publication step -- and that gate is right: a step running
      # before the send should hold nothing worth stealing. This repo is public, so its
      # run conclusions are public too: the read needs no credential and no extra
      # permission. Rate limiting (60/hr per IP, shared across runners) is handled like
      # any other failure here -- no output, no annotation, digest sent anyway.
      - name: Read the last independent return check
        id: verify
        continue-on-error: true
        run: |
          line=$(curl -sS --max-time 15 -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/verify-returns.yml/runs?status=completed&per_page=1" | jq -r 'first(.workflow_runs[]? | select(.conclusion) | "\(.conclusion)|\(.updated_at)|\(.html_url)")' || true)
          if [ -n "$line" ]; then
            echo "conclusion=$(echo "$line" | cut -d'|' -f1)" >> "$GITHUB_OUTPUT"
            echo "at=$(echo "$line" | cut -d'|' -f2)" >> "$GITHUB_OUTPUT"
            echo "url=$(echo "$line" | cut -d'|' -f3)" >> "$GITHUB_OUTPUT"
          fi
          echo "verdict: ${line:-none}"

      # Publication credentials are scoped only to the step that consumes
      # them. Validation, checkout, setup, installation, and cache restore see
      # no Drive, Gemini, claim-store, recipient, or SMTP credential.
      - name: Render & send newsletter
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUBJECT_PREFIX: "Portfolio Digest"
          ISSUE_NUMBER: ${{ github.run_number }}
          TARZAN_STABLE_EVENT_ID: ${{ steps.trigger.outputs.event_id }}
          TRIGGER_LABEL: ${{ steps.trigger.outputs.label }}
          DELIVERY_CLAIM_ENDPOINT: ${{ secrets.DELIVERY_CLAIM_ENDPOINT }}
          DELIVERY_CLAIM_TOKEN: ${{ secrets.DELIVERY_CLAIM_TOKEN }}
          VERIFY_CONCLUSION: ${{ steps.verify.outputs.conclusion }}
          VERIFY_AT: ${{ steps.verify.outputs.at }}
          VERIFY_URL: ${{ steps.verify.outputs.url }}
        run: python scripts/send_newsletter.py
