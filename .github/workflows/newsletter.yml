# Tarzan portfolio newsletter automation.
# Scheduling remains external: Apps Script dispatches named market slots and
# this workflow serializes them without cancelling an active run.
#
# One job. Native event context, compilation and installed dependency consistency
# are checked before publication credentials are bound. Full behavioral tests
# run separately in checks.yml, not before each issue. Runtime freshness,
# financial/semantic gates, delivery claims and SMTP still govern publication.
name: Tarzan Newsletter

on:
  workflow_dispatch:
    inputs:
      trigger_label:
        description: "Short single-line operational label (not appended to subject)"
        default: "manual"
        required: false
      verify_only:
        description: "Analyze/render real inputs without mail credentials, claims or SMTP"
        type: boolean
        default: false
        required: false
  repository_dispatch:
    types: [send_now]

concurrency:
  group: ${{ inputs.verify_only && 'tarzan-newsletter-verify' || 'tarzan-newsletter' }}
  queue: max              # Native bounded queue: at most 100 pending runs.
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read      # native run-created time and the optional Checks notice
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve native event context
        id: trigger
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/resolve_newsletter_event.py

      - name: Install immutable dependencies
        # --retries/--timeout, because a lost download costs a whole issue. Measured
        # on run 33767975536: validate pulled all 48 wheels in 13s while send died on
        # the 4th after 41s of silence, same commit and same pinned hashes, and
        # `set -euo pipefail` turned that into no email at all. Retrying changes
        # nothing about WHAT is installed -- --require-hashes still pins every wheel.
        # Install the runtime projection of the SAME hash lock. The five
        # test-only packages remain in Checks; no installed environment is
        # restored and no dependency/hash check is skipped.
        run: python scripts/install_runtime_dependencies.py

      - name: Compile positive Tarzan scopes
        run: python -m compileall -q tarzan scripts

      - name: Check installed dependency consistency
        run: python -m pip check

      # The repository is public. Queried market state leaves the runner only
      # as authenticated ciphertext; the dedicated key is never bound to an
      # external action. Cache outages/corruption remain ordinary cache misses.
      - name: Verify protected cache key
        id: cache_key
        continue-on-error: true
        env:
          TARZAN_CACHE_KEY_B64: ${{ secrets.TARZAN_CACHE_KEY_B64 }}
        run: python -m tarzan.data.protected_cache key-id

      - name: Restore encrypted market snapshot
        if: steps.cache_key.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tarzan-sealed/market.sealed
          key: tarzan-sealed-market-v1-r3-${{ runner.os }}-${{ steps.cache_key.outputs.key_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tarzan-sealed-market-v1-r3-${{ runner.os }}-${{ steps.cache_key.outputs.key_id }}-

      - name: Validate and import encrypted market snapshot
        id: protected_import
        if: steps.cache_key.outputs.enabled == 'true'
        continue-on-error: true
        env:
          TARZAN_CACHE_KEY_B64: ${{ secrets.TARZAN_CACHE_KEY_B64 }}
        run: python -m tarzan.data.protected_cache import --directory "$RUNNER_TEMP/tarzan-sealed"

      # A speed optimisation, never a precondition: the run refetches whatever
      # the cache does not hand back, so a cache service outage or a future
      # incompatible action release must not cost a digest.
      - name: Restore public macro snapshot
        id: public_cache
        # A successful import may be empty/partial. Skip only after the native
        # validator proves all fixed macro heads authenticated and recent.
        if: steps.protected_import.outputs.public_macro_complete != 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tarzan-public/snapshot.json
          key: tarzan-public-macro-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tarzan-public-macro-v1-${{ runner.os }}-

      - name: Validate and import public macro snapshot
        if: steps.protected_import.outputs.public_macro_complete != 'true'
        continue-on-error: true
        # Never replace an already authenticated, newer run-local history
        # with an older independently restored public projection.
        run: python -m tarzan.data.public_cache import --only-missing

      # Verification has only read-only input access and the snapshot key.
      # It has no mail/recipient/Gemini/claim credential and uses a separate
      # entry point, not the delivery path's dry-run switch.
      - name: Verify newsletter without delivery
        if: inputs.verify_only
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          TARZAN_CACHE_KEY_B64: ${{ secrets.TARZAN_CACHE_KEY_B64 }}
          TARZAN_DIAGNOSTIC_DIR: ${{ runner.temp }}/tarzan-diagnostics
          TARZAN_RESTRICTED_CONSOLE: "1"
        run: python scripts/verify_newsletter.py

      # Publication credentials remain scoped only to the actual send step.
      # Checkout/setup/install/cache actions see no input or mail credential.
      - name: Render & send newsletter
        if: ${{ !inputs.verify_only }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUBJECT_PREFIX: "Portfolio Digest"
          ISSUE_NUMBER: ${{ github.run_number }}
          TARZAN_STABLE_EVENT_ID: ${{ steps.trigger.outputs.event_id }}
          TARZAN_REQUESTED_AT: ${{ steps.trigger.outputs.requested_at }}
          TARZAN_WORKFLOW_CREATED_AT: ${{ steps.trigger.outputs.run_created_at }}
          TARZAN_RESTRICTED_CONSOLE: "1"
          TRIGGER_LABEL: ${{ steps.trigger.outputs.label }}
          DELIVERY_CLAIM_ENDPOINT: ${{ secrets.DELIVERY_CLAIM_ENDPOINT }}
          DELIVERY_CLAIM_TOKEN: ${{ secrets.DELIVERY_CLAIM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TARZAN_CACHE_KEY_B64: ${{ secrets.TARZAN_CACHE_KEY_B64 }}
          TARZAN_DIAGNOSTIC_DIR: ${{ runner.temp }}/tarzan-diagnostics
        run: python scripts/send_newsletter.py

      - name: Encrypt updated market snapshot
        id: protected_export
        if: always() && !cancelled() && steps.cache_key.outputs.enabled == 'true'
        continue-on-error: true
        env:
          TARZAN_CACHE_KEY_B64: ${{ secrets.TARZAN_CACHE_KEY_B64 }}
        run: python -m tarzan.data.protected_cache export --directory "$RUNNER_TEMP/tarzan-sealed"

      - name: Save encrypted market snapshot
        if: always() && !cancelled() && steps.protected_export.outcome == 'success' && steps.protected_export.outputs.nonempty == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tarzan-sealed/market.sealed
          # A unique immutable key per attempt saves newly learned mappings and
          # tails even after a same-day hit, including useful partial evidence.
          key: tarzan-sealed-market-v1-r3-${{ runner.os }}-${{ steps.cache_key.outputs.key_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Project public macro snapshot
        id: cache_export
        # Keep updating the independent public fallback even when its restore
        # was unnecessary; a future key/cache outage must not find it abandoned.
        if: always() && !cancelled()
        continue-on-error: true
        run: python -m tarzan.data.public_cache export

      - name: Save verified public macro snapshot
        if: always() && !cancelled() && steps.cache_export.outcome == 'success' && steps.cache_export.outputs.nonempty == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tarzan-public/snapshot.json
          key: tarzan-public-macro-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain encrypted diagnostic evidence
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarzan-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tarzan-diagnostics/report.sealed
          retention-days: 14
          compression-level: 0
          if-no-files-found: ignore
