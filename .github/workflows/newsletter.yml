# Tarzan portfolio newsletter automation.
# Scheduling remains external: Apps Script dispatches named market slots and
# this workflow serializes them without cancelling an active run.
#
# One job. Publication is gated on the code compiling and its pinned dependencies
# agreeing -- seconds. Behaviour (the test suite) and declaration audits run on
# every push in checks.yml, which is where the code changes: re-running 1400 tests
# before each issue cost ~2 min per send and let one red test withhold every digest.
name: Tarzan Newsletter

on:
  workflow_dispatch:
    inputs:
      trigger_label:
        description: "Short single-line operational label (not appended to subject)"
        default: "manual"
        required: false
  repository_dispatch:
    types: [send_now]

concurrency:
  group: tarzan-newsletter
  queue: max              # Native bounded queue: at most 100 pending runs.
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read      # native run-created time and the optional Checks notice
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve native event context
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/resolve_newsletter_event.py

      - name: Install immutable dependencies
        # --retries/--timeout, because a lost download costs a whole issue. Measured
        # on run 33767975536: validate pulled all 48 wheels in 13s while send died on
        # the 4th after 41s of silence, same commit and same pinned hashes, and
        # `set -euo pipefail` turned that into no email at all. Retrying changes
        # nothing about WHAT is installed -- --require-hashes still pins every wheel.
        run: python -m pip install --require-hashes --retries 5 --timeout 30 -r requirements.txt

      - name: Compile positive Tarzan scopes
        run: python -m compileall -q tarzan scripts

      - name: Check installed dependency consistency
        run: python -m pip check

      # A speed optimisation, never a precondition: the run refetches whatever
      # the cache does not hand back, so a cache service outage or a future
      # incompatible action release must not cost a digest.
      - name: Restore public macro snapshot
        id: public_cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tarzan-public/snapshot.json
          key: tarzan-public-macro-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tarzan-public-macro-v1-${{ runner.os }}-

      - name: Validate and import public macro snapshot
        continue-on-error: true
        run: python -m tarzan.data.public_cache import

      # Publication credentials are scoped only to the step that consumes
      # them. Validation, checkout, setup, installation, and cache restore see
      # no Drive, Gemini, claim-store, recipient, or SMTP credential.
      - name: Render & send newsletter
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUBJECT_PREFIX: "Portfolio Digest"
          ISSUE_NUMBER: ${{ github.run_number }}
          TARZAN_STABLE_EVENT_ID: ${{ steps.trigger.outputs.event_id }}
          TARZAN_REQUESTED_AT: ${{ steps.trigger.outputs.requested_at }}
          TARZAN_WORKFLOW_CREATED_AT: ${{ steps.trigger.outputs.run_created_at }}
          TARZAN_RESTRICTED_CONSOLE: "1"
          TRIGGER_LABEL: ${{ steps.trigger.outputs.label }}
          DELIVERY_CLAIM_ENDPOINT: ${{ secrets.DELIVERY_CLAIM_ENDPOINT }}
          DELIVERY_CLAIM_TOKEN: ${{ secrets.DELIVERY_CLAIM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/send_newsletter.py

      - name: Project public macro snapshot
        id: cache_export
        if: always() && !cancelled()
        continue-on-error: true
        run: python -m tarzan.data.public_cache export

      - name: Save verified public macro snapshot
        if: always() && !cancelled() && steps.cache_export.outcome == 'success' && steps.cache_export.outputs.nonempty == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tarzan-public/snapshot.json
          key: tarzan-public-macro-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
