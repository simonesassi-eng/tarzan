# Ordinary CI, deliberately OUTSIDE the delivery path.
#
# This exists so a broken commit costs a red tick now, instead of surfacing in
# tomorrow morning's digest. Nothing here can stop a newsletter from going out,
# and nothing here is required for one to go out: the delivery workflow runs its
# own copy of the same behavioural gate, so a dispatch on a commit whose CI has
# not finished (or never ran) still validates itself before sending.
#
# It used to also audit declarations — a release manifest, its pins, a positive
# scope, documentation claims — via scripts/validate_release.py. Both are gone:
# the manifest restated constants that live in the code, so the audit mostly
# checked a copy against its original, and one of its assertions was that this
# workflow runs the audit. What was load bearing (credential placement, action
# SHA pinning, dependency hash locking, one version authority) is asserted in
# tarzan/tests/test_delivery_gates.py, which runs in BOTH workflows.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install immutable dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Compile positive Tarzan scopes
        run: python -m compileall -q tarzan scripts

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run Tarzan tests
        run: python -m pytest tarzan/tests -q
