# Ordinary CI, deliberately OUTSIDE the delivery path.
#
# This is the ONLY place the test suite runs. Nothing here can stop a newsletter
# from going out: the delivery workflow only compiles and runs `pip check` (since
# d4e0788), and an issue built from a commit whose run here FAILED is still sent,
# with a one-line warning above it (tarzan.delivery._failed_checks_sha).
#
# It used to also audit declarations — a release manifest, its pins, a positive
# scope, documentation claims — via scripts/validate_release.py. Both are gone:
# the manifest restated constants that live in the code, so the audit mostly
# checked a copy against its original, and one of its assertions was that this
# workflow runs the audit. What was load bearing (credential placement, action
# SHA pinning, dependency hash locking, one version authority) is asserted in
# tarzan/tests/test_delivery_gates.py.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install immutable dependencies
        # --retries/--timeout for the same reason as newsletter.yml: a lost
        # download is a failed run, and retrying changes nothing about WHAT is
        # installed -- --require-hashes still pins every wheel.
        run: python -m pip install --require-hashes --retries 5 --timeout 30 -r requirements.txt

      - name: Compile positive Tarzan scopes
        run: python -m compileall -q tarzan scripts

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run Tarzan tests
        run: python -m pytest tarzan/tests -q
