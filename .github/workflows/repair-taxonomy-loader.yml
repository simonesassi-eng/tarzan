name: Repair taxonomy loader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pandas pyyaml
      - name: Harden taxonomy loader if needed
        id: repair
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tarzan/config/__init__.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('@lru_cache(maxsize=1)\ndef _load_indexes_csv()')
          end = s.index('\n\ndef _by_isin_and_ticker', start)
          old = s[start:end]
          new = '''@lru_cache(maxsize=1)\ndef _load_indexes_csv() -> pd.DataFrame:\n    """Load the curated instrument taxonomy deterministically.\n\n    The taxonomy is runtime data, not optional configuration. Resolve it from\n    an explicit environment override first, then search upward from the\n    current working directory and from this module's repository ancestors.\n    This makes CLI, pytest and installed-package execution agree on the same\n    repository data instead of silently depending on the caller's cwd.\n    """\n    from pathlib import Path\n\n    candidates: list[Path] = []\n    override = os.environ.get("TARZAN_TAXONOMY_PATH")\n    if override:\n        candidates.append(Path(override).expanduser())\n\n    def add_ancestors(start: Path) -> None:\n        start = start.resolve()\n        for parent in (start, *start.parents):\n            candidates.append(parent / "input" / "instrument_taxonomy.csv")\n\n    add_ancestors(Path.cwd())\n    add_ancestors(Path(__file__).resolve())\n\n    seen: set[str] = set()\n    path = None\n    for candidate in candidates:\n        key = str(candidate)\n        if key in seen:\n            continue\n        seen.add(key)\n        if candidate.is_file():\n            path = candidate\n            break\n\n    if path is None:\n        _warn_taxonomy(\n            "instrument_taxonomy.csv not found; looked from cwd/module ancestors; "\n            "benchmarks, beta reference and notional asset-class splits will use "\n            "built-in defaults"\n        )\n        return pd.DataFrame()\n\n    try:\n        df = pd.read_csv(path)\n        df.columns = [c.strip().lower() for c in df.columns]\n        required = {"name", "ticker", "isin", "kind", "asset_class"}\n        missing = required.difference(df.columns)\n        if df.empty or missing:\n            raise ValueError(\n                f"missing required columns {sorted(missing)} or empty file"\n            )\n        return df\n    except Exception as e:  # noqa: BLE001\n        _warn_taxonomy(\n            f"instrument_taxonomy.csv at '{path}' could not be parsed ({e}); "\n            "benchmarks/beta/notional splits fall back to defaults"\n        )\n        return pd.DataFrame()\n'''
          if old != new:
              p.write_text(s[:start] + new + s[end:], encoding='utf-8')
          PY
          if grep -q 'Load the curated instrument taxonomy deterministically' tarzan/config/__init__.py; then
            echo 'patched=true' >> "$GITHUB_OUTPUT"
          else
            echo 'patched=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit repair
        if: steps.repair.outputs.patched == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tarzan/config/__init__.py
          git commit -m "fix: make taxonomy path resolution deterministic"
          git push
      - name: Test suite
        if: steps.repair.outputs.patched != 'true'
        run: python -m pytest tarzan/tests -q
