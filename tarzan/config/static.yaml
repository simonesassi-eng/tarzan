# Static configuration — rarely changed parameters

# ---------------------------------------------------------------------------
# Exchange: ticker suffix → country
# ---------------------------------------------------------------------------
exchange_country:
  ".MI": Italy
  ".PA": France
  ".DE": Germany
  ".AS": Netherlands
  ".L": United Kingdom
  ".TO": Canada
  ".AX": Australia
  ".HK": Hong Kong
  ".T": Japan
  ".KS": South Korea
  ".TW": Taiwan
  ".SA": Brazil
  ".MX": Mexico

# ---------------------------------------------------------------------------
# ISIN probing suffixes
# ---------------------------------------------------------------------------
# Probed in order, so the venues an EUR investor actually trades come first
# and a later entry only ever answers what the earlier ones could not. Munich
# (.MU) is last: it is the sole Yahoo venue carrying a price for some
# swap-based UCITS listings (IS39 among them), and without it those resolve to
# no history at all.
isin_exchange_suffixes:
  - ".MI"
  - ".SG"
  - ".ETLX"
  - ".DE"
  - ".F"
  - ".L"
  - ".PA"
  - ".MU"

