# ---------------------------------------------------------------------------
# ISIN probing suffixes
# ---------------------------------------------------------------------------
# This order is the RANK TIEBREAK and nothing more: ``enricher._suffix_priority``
# returns the index, and that index is the last element of ``_rank_key(curated,
# name_bucket, currency_match, suffix_rank)``. Two candidates tying on everything
# observable are separated by this order alone.
#
# It is ALSO the probe order, but that half does not bite. ``_MAX_RESOLVE_FETCHES``
# counts candidates that ANSWERED, not fetches, and the break is evaluated before
# each probe with len(metas) <= i — so symbols 0..9 are always probed, and for a
# curated hint those first ten are exactly the hint plus all nine venues. Measured:
# the cap never truncates before the winner for any curated instrument, and live
# truncation (3 of 32 ISIN resolutions) always happened after the hint block with
# the winner already probed, at the identical point under any order.
#
# Milan first: it is where this book actually trades. Munich (.MU) and SIX (.SW)
# are last on purpose. Munich is the sole Yahoo venue carrying a price for some
# swap-based UCITS (IS39 among them), so it must be REACHABLE without winning a
# tie. .SW is the same shape once you test the right thing: it is never the sole
# usable venue for anything here, and promoting it moves a held instrument from
# its London line (1262 closes) to its Swiss one (1254) — a tiebreak change with
# nothing to recommend it.
#
# .SG (Stuttgart) outranking .DE (Xetra) looks wrong and is measured to cost
# nothing. Of 91 curated roots, .SG yields a usable daily series for exactly ONE,
# and that one is a different instrument (CL2.SG is CyberAgent Inc, not the
# fund) which .MI outranks anyway; its other ten candidates quote a live price with
# ZERO closes in a five-year pull, so both usability tests reject them. Swapping
# the pair changes 0 of 91 resolutions and saves 6 history fetches across 32 cold
# resolutions. So the order stays: its presence is unconstrained by any evidence in
# this book, and so is its removal. What DOES depend on it is
# test_enricher.py::test_prefers_candidate_with_usable_history, which uses a .SG
# candidate to prove the history preference beats suffix priority — demote .SG and
# that test passes for the wrong reason.
#
# .ETLX was deleted after measurement, not on suspicion: it admitted zero
# candidates for all 91 roots through the real ranking gate (_fetch_candidate_meta
# returns None; 98 chart 404s), the taxonomy holds no Italian ISIN and no bond, and
# removing it preserves every other pair's relative order — so it could not change
# a resolution, only stop spending ~2 dead provider calls per root per run.
isin_exchange_suffixes:
  - ".MI"
  - ".SG"
  - ".DE"
  - ".F"
  - ".L"
  - ".PA"
  - ".MU"
  # SIX Swiss. Without it every Swiss listing was UNREACHABLE by ISIN: Nestle's
  # own ISIN could not reach NESN.SW at all. See the note above on why last is
  # the wrong place for it and why it is here anyway.
  - ".SW"

